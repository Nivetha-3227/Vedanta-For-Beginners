<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soundarya Lahari</title>
  <link href="style.css" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-title">Vedanta For Beginners</div>
    <div class="nav-links">
      <a href="index.html#dashboard">Dashboard</a>
      <a href="index.html#lectures">Lectures</a>
    </div>
  </nav>

  <div class="section">
    <h2>Soundarya Lahari</h2>
    <div id="container"></div>
  </div>

  <script>
    const baseURL = "https://pub-1d0374a050c547f9887ff5b729f12594.r2.dev/";

    function loadAudio(button, src) {
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.innerHTML = `<source src="${src}" type="audio/mp4">`;
      button.replaceWith(audio);
      audio.play();
    }

    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('container');

        data.soundaryalahari.slokas.forEach(sloka => {
          const div = document.createElement('div');
          div.className = 'lecture-container';
          div.innerHTML = `
            <div class="lecture-card">
              <h3>Sloka ${sloka.label} - Tamil</h3>
              <button class="play-btn" onclick="loadAudio(this, '${baseURL + encodeURIComponent(sloka.tamil)}')">▶ Play</button>
            </div>
          `;
          container.appendChild(div);
        });
      })
      .catch(error => {
        console.error('Error loading data:', error);
      });
  </script>

</body>
</html>
